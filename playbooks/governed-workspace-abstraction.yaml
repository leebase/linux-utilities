            "type": "command_succeeds",
            "command": "PYTHONDONTWRITEBYTECODE=1 python3 -m compileall tests/test_governed_workspace_abstraction.py",
            "require_collected_tests": false
          }
        ]
      },
      "on_fail": {
        "retry_message": "Repair only the authored validator tests. Keep the existing repository-owned journey manifest unchanged, hash-pinned, trace-complete, and syntactically valid.",
        "after_retries_exhausted": "halt"
