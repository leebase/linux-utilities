{
  "playbook_id": "governed_workspace_abstraction_delivery",
  "name": "Governed workspace abstraction delivery",
  "authoring_notes": [
    "All repository paths in this playbook are workspace-relative POSIX paths. The user-journey manifest is the repository-owned oracle at tests/user_journeys_manifest.json; validator path resolution is rooted at the governed workspace and rejects absolute, parent-escaping, and symlink-escaping candidates.",
    "The manifest is an existing immutable input and is pinned before implementation, repair, and user-simulation acceptance. Repair may change only its declared implementation, tests, documentation, and playbook paths; it cannot write the manifest that evaluates the repair.",
    "The canonical user-test result is an object with journeys and findings. Each journey requires name, status, steps_taken, and commands_run; each command claim requires command and integer exit_code, and each finding requires id, severity, journey, problem, reproduction, expected, actual, and proposed_fix, with optional observations and workspace-relative artifacts.",
    "user_journeys_execution_verified re-executes only shell-word-split argv prefixes from command_allowlist with token-by-token matching, directly from the governed workspace root without a shell; shell operators, prefix misses, and zero verified claims fail closed.",
    "The current manifest has author-owned and exploratory journeys, so no external seed is required. If a human- or mission-owned seed is introduced, its workspace-relative seed path must be declared as an input, remain outside implementation and repair write scopes, and be supplied as seed_path to user_journeys_all_passed.",
    "The canonical smoke route remains tests/smoke_manifest.json -> smoke helpers -> scripts/smoke.sh -> make test. It is aggregate sysdiff evidence, not a substitute for direct journey evidence."
  ],
  "defaults": {
    "worker": "codex_cli",
    "routing": {
      "primary": {
        "harness": "codex_cli",
        "model": "gpt-5.6-luna"
      }
    },
    "retry_policy": {
      "max_attempts": 2,
      "strategy": "rerun_with_validation_feedback"
    }
  },
  "roles": {
    "implementation_worker": [
      {
        "harness": "codex_cli",
        "model": "gpt-5.6-luna"
      }
    ],
    "user_tester": [
      {
        "harness": "claude_code",
        "model": "claude-sonnet-5"
      }
    ],
    "slice_reviewer": [
      {
        "harness": "claude_code",
        "model": "claude-sonnet-5"
      }
    ]
  },
  "run_policy": {
    "on_step_failure": "halt",
    "require_validation_pass_to_advance": true
  },
  "operational_paths": ["tmp", ".agent-orch-scratch"],
  "steps": [
    {
      "step_id": "step_01_define_slice_contract",
      "name": "Define the governed workspace abstraction contract",
      "role": "implementation_worker",
      "mission": "Read AGENTS.md and the current repository orientation. Define the governed workspace abstraction contract under docs/ with the repository-owned manifest path, workspace-relative path containment, direct command_allowlist argv-prefix execution, authority and AC-N traceability, immutable manifest protection, result discipline, and the boundary between deterministic smoke and independent user journeys. Use exact Markdown headings Overview, Problem, Constraints, and Acceptance Checks, with at least 120 non-whitespace characters under each heading. Keep all writes within docs/.",
      "inputs": [
        "AGENTS.md",
        "context.md",
        "architecture.md",
        "product-definition.md"
      ],
      "allowed_paths": ["docs/governed-workspace-abstraction-contract.md"],
      "outputs": {
        "required": [
          {
            "path": "docs/governed-workspace-abstraction-contract.md",
            "type": "markdown"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "file_exists",
            "path": "docs/governed-workspace-abstraction-contract.md"
          },
          {
            "type": "markdown_headings_present",
            "path": "docs/governed-workspace-abstraction-contract.md",
            "headings": ["Overview", "Problem", "Constraints", "Acceptance Checks"],
            "min_chars_under_heading": 120
          }
        ]
      },
      "on_fail": {
        "retry_message": "Repair the contract with concrete workspace, command, authority, traceability, immutability, and result-gate rules under the declared docs path.",
        "after_retries_exhausted": "halt"
      }
    },
    {
      "step_id": "step_03_plan_slice_delivery",
      "name": "Plan the governed workspace abstraction",
      "role": "implementation_worker",
      "mission": "Read the contract and write an implementation plan covering the repository-owned manifest, canonical workspace-relative resolution including symlink containment, token-by-token command allowlisting with no shell, journey authority and contract traces, manifest pinning, producer repair scope, result evidence, compatibility tests, smoke, and review. Map every AC-N to a concrete action. Use exact Markdown headings Architecture, Tests, Verification, and Risks, with at least 120 non-whitespace characters under each heading. Keep all writes within plans/.",
      "inputs": [
        "AGENTS.md",
        "architecture.md",
        "docs/governed-workspace-abstraction-contract.md"
      ],
      "allowed_paths": ["plans/governed-workspace-abstraction-implementation-plan.md"],
      "outputs": {
