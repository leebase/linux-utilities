    },
    {
      "step_id": "step_05_implement_slice",
      "name": "Implement the governed workspace abstraction",
      "role": "implementation_worker",
      "mission": "Read the contract, plan, separately authored tests, existing workflow playbook, pinned journey manifest, smoke manifest and helpers, and compatibility tests. Repair only playbooks/governed-workspace-abstraction.yaml. Its user-simulation gate must use docs/governed-workspace-abstraction-contract.md as contract_path, pin tests/user_journeys_manifest.json, preserve complete AC-1 through AC-10 traceability, and enforce the canonical result fields: journeys and findings; journey name/status/steps_taken/commands_run; command command/exit_code with optional stdout_contains; and finding id/severity/journey/problem/reproduction/expected/actual/proposed_fix with optional observations/artifacts. Pair user_journeys_all_passed with the non-advisory user_journeys_execution_verified rule. Require token-by-token matching of shell-word-split argv prefixes, direct execution from the governed workspace root without a shell, and rejection of shell operators, prefix misses, wrong-cwd claims, and zero verified claims. Prevent the user tester from writing product or test paths, and route failures to the prior repair-and-verify step. Preserve distinct deterministic smoke, user-simulation, and independent review gates. Do not modify tests or the pinned manifest; preserve callers and fixtures encoded by the governed-run and commissioning compatibility tests. Keep the only write within the target playbook path.",
      "inputs": [
